<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
  <title>Indian Coin Information</title>
  <defs>
    <linearGradient id="coin" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c77a5d" />
      <stop offset=".52" stop-color="#9c5036" />
      <stop offset="1" stop-color="#713923" />
    </linearGradient>
    <linearGradient id="rupee" x1="24" y1="17" x2="40" y2="48" gradientUnits="userSpaceOnUse">
